<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboFace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #12122a;
      overflow: hidden;
    }

    /* 全屏铺满，保持动画宽高比居中 */
    dotlottie-wc {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<dotlottie-wc
  id="roboface"
  src="./RoboFace.lottie"
  autoplay
  loop
  statemachineid="StateMachine1"
></dotlottie-wc>

<script type="module">
  import "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.9.27/dist/dotlottie-wc.js";

  const player = document.getElementById("roboface");
  const POLL_INTERVAL_MS = 500;

  let currentState = null;   // 已应用到动画的状态
  let smReady = false;       // 状态机是否已就绪

  // 状态机加载完成后标记就绪（statemachineid 属性会自动 load+start）
  function watchReady() {
    const dotLottie = player.dotLottie;
    if (!dotLottie) return setTimeout(watchReady, 50);
    if (dotLottie.isLoaded) {
      smReady = true;
      applyState(currentState);
    } else {
      dotLottie.addEventListener("load", () => {
        smReady = true;
        applyState(currentState);
      });
    }
  }

  function applyState(state) {
    if (!smReady || !state) return;
    const dotLottie = player.dotLottie;
    if (!dotLottie) return;
    dotLottie.stateMachineSetStringInput("states", state);
    currentState = state;
  }

  async function pollState() {
    try {
      const res = await fetch("/api/state");
      if (!res.ok) return;
      const { state } = await res.json();
      if (state && state !== currentState) {
        applyState(state);
      }
    } catch (e) {
      console.error("轮询状态失败", e);
    }
  }

  watchReady();
  setInterval(pollState, POLL_INTERVAL_MS);
  pollState();
</script>

</body>
</html>
