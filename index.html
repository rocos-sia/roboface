<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboFace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* 全屏铺满，保持动画宽高比居中 */
    dotlottie-wc {
      display: block;
      position: fixed;
      left: 50%;
      top: 50%;
      width: 100vw;
      height: 100vh;
      background: #000;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

<script type="module">
  import { setWasmUrl } from "./vendor/dotlottie-wc.js";

  setWasmUrl("./vendor/dotlottie-player.wasm");

  const player = document.createElement("dotlottie-wc");
  player.id = "roboface";
  player.src = "./RoboFace.lottie";
  player.autoplay = true;
  player.loop = true;
  player.setAttribute("statemachineid", "StateMachine1");
  document.body.appendChild(player);

  const POLL_INTERVAL_MS = 500;

  let currentState = null;   // 已应用到动画的状态
  let currentRotation = null;
  let smReady = false;       // 状态机是否已就绪

  // 状态机加载完成后标记就绪（statemachineid 属性会自动 load+start）
  function watchReady() {
    const dotLottie = player.dotLottie;
    if (!dotLottie) return setTimeout(watchReady, 50);
    if (dotLottie.isLoaded) {
      smReady = true;
      applyState(currentState);
    } else {
      dotLottie.addEventListener("load", () => {
        smReady = true;
        applyState(currentState);
      });
    }
  }

  function applyState(state) {
    if (!smReady || !state) return;
    const dotLottie = player.dotLottie;
    if (!dotLottie) return;
    dotLottie.stateMachineSetStringInput("states", state);
    currentState = state;
  }

  async function pollState() {
    try {
      const res = await fetch("/api/state");
      if (!res.ok) return;
      const { state } = await res.json();
      if (state && state !== currentState) {
        applyState(state);
      }
    } catch (e) {
      console.error("轮询状态失败", e);
    }
  }

  function applyRotation(rotation) {
    const quarterTurn = rotation === 90 || rotation === 270;
    player.style.width = quarterTurn ? "100vh" : "100vw";
    player.style.height = quarterTurn ? "100vw" : "100vh";
    player.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
    currentRotation = rotation;
  }

  async function pollRotation() {
    try {
      const res = await fetch("/api/rotation");
      if (!res.ok) return;
      const { rotation } = await res.json();
      if (rotation !== currentRotation) {
        applyRotation(rotation);
      }
    } catch (e) {
      console.error("轮询旋转角度失败", e);
    }
  }

  watchReady();
  setInterval(pollState, POLL_INTERVAL_MS);
  setInterval(pollRotation, POLL_INTERVAL_MS);
  pollState();
  pollRotation();
</script>

</body>
</html>
