<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboFace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #12122a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      gap: 20px;
    }

    canvas { display: block; width: 608px; height: 288px; }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      background: #2d2d50;
      color: #e0e0ff;
      border: 1px solid #4a4a80;
      border-radius: 6px;
      font-size: 14px;
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    button:hover   { background: #3d3d70; border-color: #8080c0; }
    button:active  { background: #5050a0; }
    button.active  { background: #4a4a90; border-color: #a0a0ff; }
  </style>
</head>
<body>

<canvas id="canvas" width="1520" height="719"></canvas>

<div class="controls">
  <button data-state="smile"   class="active">Smile</button>
  <button data-state="proud"          >Proud</button>
  <button data-state="unhappy"        >Unhappy</button>
  <button data-state="daze"           >Daze</button>
</div>

<script type="module">
  import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web@0.79.2/+esm";

  const player = new DotLottie({
    canvas: document.getElementById("canvas"),
    src: "./RoboFace.lottie",
    autoplay: true,
    loop: true,
  });

  player.addEventListener("load", () => {
    player.stateMachineLoad("StateMachine1");
    player.stateMachineStart();
    player.stateMachineSetStringInput("states", "smile");
  });

  player.addEventListener("loadError", (e) => console.error("load error", e));

  // 按钮切换状态
  const buttons = document.querySelectorAll("button[data-state]");
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      player.stateMachineSetStringInput("states", btn.dataset.state);
    });
  });
</script>

</body>
</html>
